<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download Test Page – INK</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #F6F5F0;
      color: #121212;
      max-width: 520px;
      margin: 40px auto;
      padding: 24px;
      border: 4px solid #121212;
      box-shadow: 5px 5px 0 #121212;
    }
    h1 { margin-top: 0; letter-spacing: 1px; }
    a {
      display: block;
      margin: 12px 0;
      padding: 12px 16px;
      background: #F6F5F0;
      color: #121212;
      text-decoration: none;
      font-weight: 800;
      border: 3px solid #121212;
      box-shadow: 4px 4px 0 #121212;
    }
    a:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #121212; }
    .accent { color: #E60012; }
  </style>
</head>
<body>
  <h1>DOWNLOAD <span class="accent">TEST</span></h1>
  <p>Tap a link below. INK should detect the file and offer to download it.</p>

  <a href="sample_download.txt" download>📄 sample_download.txt</a>
  <a href="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf" download>📕 dummy.pdf (external)</a>
  <a href="https://file-examples.com/storage/fe8c7eef0c6364f6c9504cc/2017/11/file_example_MP3_700KB.mp3" download>🎵 sample.mp3 (external)</a>

  <p style="margin-top:24px;font-size:13px;opacity:.7">
    Open this page from the app (file:// or via a local server) to test the Media Sniffer.
  </p>
</body>
</html>
